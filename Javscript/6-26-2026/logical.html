  <body></body>
  <script>
    /**
     * Logical operators
     * &&, ||
     *
     */
    var a = 10;
    var b = 20;
    var c = 40;
    var d = 10;
    var e = "10";
    console.log(a == d && a === e && d == e && b > c);
    console.log(a == d || a === e || d == e || b > c);
    console.log(a == d || (a == e && d != e));
  </script>
