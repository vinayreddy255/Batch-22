<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=\, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    /**
     * Comparsion operators
     * ==, ===, !=, !==, >,>=,<,<=
     */
    var a = 10;
    var b = "10";
    console.log(a == b); //true
    console.log(a === b); //false

    //!
    console.log(a != b); //false
    console.log(a !== b); //true
    //>
    console.log(a > b); //false
    console.log(a < b); //false
    console.log(a <= b); //true
    console.log(a <= b); //true
    console.log(a >= b); //true
  </script>
</html>
