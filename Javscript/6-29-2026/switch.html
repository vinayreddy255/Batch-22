<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    var x = 10;
    if (x === 20) {
      console.log("Hi");
    } else if (x > 10) {
      console.log("Hello");
    } else if (x >= 10) {
      console.log("welcome");
    } else {
      console.log("statement failed");
    }
    switch (x) {
      case 20:
        console.log("Hi switch");
        break;
      case x > 20:
        console.log("Hello switch");
        break;
      case 10:
        console.log("welcome switch");
        break;
      default:
        console.log("statement failed");
        break;
    }
  </script>
</html>
