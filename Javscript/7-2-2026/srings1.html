<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

  <body></body>
  <script>
    /**
     * length: Returns the length of a string.
     * charAt: Returns the character at a specified index.
     * indexOf: Returns the index of the first occurrence of a specified value in a string.
     * lastIndexOf: Returns the index of the last occurrence of a specified value in a string.
     * toUpperCase: Converts a string to uppercase letters.
     * toLowerCase: Converts a string to lowercase letters.
     * trim: Removes whitespace from both ends of a string.
     * split: Splits a string into an array of substrings based on a specified separator.
     * substring: Returns a portion of a string between two specified indices.
     * replace: Replaces a specified value with another value in a string.
     * replaceAll: Replaces all occurrences of a specified value with another value in a string.
     * repeat: Repeats a string a specified number of times.
     * includes: Checks if a string contains a specified value.
     *
     */
    var str = "Hello World! React World!";
    var str1 = "   Hello World!   ";
    console.log("Length:", str.length);
    console.log("Character at index 7:", str.charAt(2));
    console.log("Index of 'o':", str.indexOf("o")); //4
    // console.log("Index of 'o':", str.indexOf("O"));
    console.log("Last index of 'o':", str.lastIndexOf("o")); //8
    console.log("Includes 'World':", str.includes("Wor"));
    console.log("Uppercase:", str.toUpperCase());
    console.log("Lowercase:", str.toLowerCase());
    console.log("length:", str1.length);
    console.log("Trimmed:", str1.trim());
    var ar = str.split(" "); //[Hello, world!]
    console.log("Split:", ar);

    console.log(
      "Replace 'World' with 'JavaScript':",
      str.replace("World", "JavaScript"),
    );
    console.log(
      "Replace all 'World' with 'JavaScript':",
      str.replaceAll("World", "JavaScript"),
    );
    console.log("Repeat 3 times:", str.repeat(3));

    console.log("Substring (0, 5):", str.substring(1, 3)); //Hello
    console.log("substr :", str.substr(1, 3)); //World!
