<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    /**
     * length: it returns the number of elements in an array.
     * push: it adds one or more elements to the end of an array and returns the new length of the array.
     * pop: it removes the last element from an array and returns that element.
     * shift: it removes the first element from an array and returns that removed element.
     * unshift: it adds one or more elements to the beginning of an array and returns the new length of the array.
     * splice: it changes the contents of an array by removing or replacing existing elements and/or adding new elements in place.
     * slice: it returns a shallow copy of a portion of an array into a new array object selected from start to end (end not included) where start and end represent the index of items in that array.
     * concat: it is used to merge two or more arrays. This method does not change the existing arrays, but instead returns a new array.
     * indexOf: it returns the first index at which a given element can be found in the array, or -1 if it is not present.
     * includes: it determines whether an array includes a certain value among its entries, returning true or false as appropriate.
     * join: it creates and returns a new string by concatenating all of the elements in an array (or an array-like object), separated by commas or a specified separator string.
     * reverse: it reverses the order of the elements of an array in place. (The first array element becomes the last, and the last array element becomes the first.)
     * sort: it sorts the elements of an array in place and returns the sorted array. The default sort order is according to string Unicode code points.
     * isArray: it determines whether the passed value is an Array.
     * forEach: it executes a provided function once for each array element.
     * map: it creates a new array populated with the results of calling a provided function on every element in the calling array.
     * filter: it creates a new array with all elements that pass the test implemented by the provided function.
     * reduce: it executes a reducer function (that you provide) on each element of the array, resulting in a single output value.
     * find: it returns the value of the first element in the provided array that satisfies the provided testing function. Otherwise undefined is returned.
     * findIndex: it returns the index of the first element in the array that satisfies the provided testing function. Otherwise, it returns -1, indicating that no element passed the test.
     * every: it tests whether all elements in the array pass the test implemented by the provided function. It returns a Boolean value.
     * some: it tests whether at least one element in the array passes the test implemented by the provided function. It returns a Boolean value.
     * delete: it removes an element from an array at a specified index, leaving a hole in the array (i.e., the length of the array remains the same).
     * concat: it is not a standard array method in JavaScript. However, if you meant "concat", it is used to merge two or more arrays. This method does not change the existing arrays, but instead returns a new array.
     * toString: it returns a string representing the specified array and its elements. The elements are converted to strings and separated by commas.
     */
    var arr = ["apple", "banana", "cherry", "grape"];
    console.log("Original array:", arr);
    console.log("Length of array:", arr.length); // length
    arr.push("kiwi");
    console.log("After push:", arr); // push
    arr.unshift("mango");
    console.log("After unshift:", arr); // unshift
    arr.pop();
    console.log("After pop:", arr); // pop
    arr.shift();
    console.log("After shift:", arr); // shift
    var a1 = [];
    for (var i = 1; i <= 10; i++) {
      a1.push(i);
    }
    console.log("Array a1:", a1);
  </script>
</html>
