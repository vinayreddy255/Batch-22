<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    /**
     * splice: it changes the contents of an array by removing or replacing existing elements and/or adding new elements in place.
     * slice: it returns a shallow copy of a portion of an array into a new array object selected from start to end (end not included) where start and end represent the index of items in that array.
     * concat: it is used to merge two or more arrays. This method does not change the existing arrays, but instead returns a new array.
     * indexOf: it returns the first index at which a given element can be found in the array, or -1 if it is not present.
     * lastIndexOf: it returns the last index at which a given element can be found in the array, or -1 if it is not present. The array is searched backwards, starting at fromIndex.
     * includes: it determines whether an array includes a certain value among its entries, returning true or false as appropriate.
     * join: it creates and returns a new string by concatenating all of the elements in an array (or an array-like object), separated by commas or a specified separator string.
     * reverse: it reverses the order of the elements of an array in place. (The first array element becomes the last, and the last array element becomes the first.)
     */
    var arr = ["apple", "banana", "cherry", "date", "grape", "banana"];
    var slicedArr = arr.slice(1, 3);
    console.log("Original array:", arr);
    console.log("Sliced array (from index 1 to 4):", slicedArr);
    arr.splice(2, 2, "kiwi", "mango", "orange");
    console.log("Array after splice ", arr);
    console.log("Index of 'kiwi':", arr.indexOf("banana")); // indexOf
    console.log("lastIndexOf of 'banana':", arr.lastIndexOf("banana")); // lastIndexOf
    console.log("Does the array include 'mango'?", arr.includes("mango")); // includes
    var a1 = ["samsung", "apple", "nokia", "oneplus", "vivo", "oppo"];
    var a2 = ["redmi", "realme", "asus", "lenovo"];
    var a3 = ["micromax", "lava", "intex"];
    var mergedArray = [].concat(a1, a2, a3);
    console.log("Array a1:", a1);
    console.log("Merged array:", mergedArray);
    console.log("Joined array:", a1.join(" ")); // join
    console.log("toString of array:", a1.toString(" ")); // toString
    console.log("Reversed array:", a1.reverse()); // reverse
    /**
     * length, push, pop, shift, unshift, splice, slice, concat, indexOf, includes, join, reverse,toString, lastIndexOf
     */
  </script>
</html>
