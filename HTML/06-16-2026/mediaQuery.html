<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .media-div {
        width: 150px;
        height: 150px;
        border: 2px solid;
        background: orange;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /**
      *mobile 600
      *tablete 760
      *normale divces 920 to 1200
       */
      @media only screen and (max-width: 400px) {
        .media-div {
          background: green;
          border-radius: 50%;
          color: #fff;
          width: 200px;
          height: 200px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Media Queryies -->
    <div class="media-div">Media Queryies</div>
  </body>
</html>
