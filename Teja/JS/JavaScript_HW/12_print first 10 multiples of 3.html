<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        table = 3;
        for(i=1;i<=10;i++)
        {
            console.log(table*i);
        }
        for(i=1;i<=10;i++)
        {
            console.log(table+" * "+i+" = "+ table*i);
        }
    </script>
</body>
