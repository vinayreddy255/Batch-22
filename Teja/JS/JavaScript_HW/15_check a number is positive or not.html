<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        number = -20;
        if(number>0)
        {
            console.log(number+" is positive number");
        }
        else if(number<0)
        {
            console.log(number+" is negative number");
        }
        else
        {
            console.log(number+" is neither positive nor negative number");
        }
    </script>
</body>
</html>
