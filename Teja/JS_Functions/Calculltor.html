<script>
    function calcultor(a, b, symbol){
        switch (symbol) {
            case "+":
                result = a+b;
                console.log(result);
                break;
            case "-":
                result = a-b;
                console.log(result);
                break;
            case "*":
                result = a*b;
                console.log(result);
                break;
            case "/":
                result = a/b;
                console.log(result);
                break;
            case "%":
                result = a/b;
                console.log(result);
                break;
            default:
                console.log("No Vaild");
                break;
        }
    }  
    calcultor(10,20,"*");
</script>
