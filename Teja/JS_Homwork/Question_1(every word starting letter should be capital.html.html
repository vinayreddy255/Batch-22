<script>
    string_1 = "hello react js world";
    result = "";
    first_letter = string_1[0].toUpperCase();
    for(i=1; i<string_1.length; i++){
        if(string_1[i-1] == " "){
            result += string_1[i].toUpperCase();
        }else{
            result += string_1[i];
        }
    }
    console.log(first_letter + result); 
</script>
